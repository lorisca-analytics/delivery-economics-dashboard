<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .title { font-size:22px; font-weight:700; fill:#111827; }
      .subtitle { font-size:14px; fill:#6b7280; }
      .box { fill:#ffffff; stroke:#e5e7eb; stroke-width:1.5; }
      .boxhi { fill:#eff6ff; stroke:#1d4ed8; stroke-width:2; }
      .head { font-size:13px; font-weight:700; fill:#111827; }
      .headhi { font-size:13px; font-weight:700; fill:#1e40af; }
      .body { font-size:12px; fill:#4b5563; }
      .num { font-size:20px; font-weight:800; fill:#1d4ed8; }
      .numred { font-size:20px; font-weight:800; fill:#b91c1c; }
      .arrow { stroke:#9ca3af; stroke-width:2; fill:none; marker-end:url(#ah2); }
    </style>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#9ca3af" stroke-width="2"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#f6f7f9"/>
  <text x="40" y="44" class="title">Path of the analysis</text>
  <text x="40" y="66" class="subtitle">From raw data to a decision a business can act on — every step verified.</text>

  <!-- step 1 -->
  <rect x="40" y="100" width="150" height="380" rx="12" class="box"/>
  <text x="58" y="132" class="head">1 · Raw data</text>
  <text x="58" y="160" class="num">171</text>
  <text x="58" y="182" class="body"><tspan x="58" dy="0">order lines</tspan><tspan x="58" dy="18">13 customers</tspan><tspan x="58" dy="18">45 SKUs mapped</tspan><tspan x="58" dy="18">zone addresses</tspan></text>
  <!-- step 2 -->
  <rect x="214" y="100" width="150" height="380" rx="12" class="box"/>
  <text x="232" y="132" class="head">2 · Verify</text>
  <text x="232" y="160" class="num">0</text>
  <text x="232" y="182" class="body"><tspan x="232" dy="0">misses in the SKU</tspan><tspan x="232" dy="18">mapping. Independent</tspan><tspan x="232" dy="18">Python recompute</tspan><tspan x="232" dy="18">matched the model</tspan><tspan x="232" dy="18">exactly.</tspan></text>
  <!-- step 3 -->
  <rect x="388" y="100" width="150" height="380" rx="12" class="box"/>
  <text x="406" y="132" class="head">3 · Audit</text>
  <text x="406" y="160" class="num">3</text>
  <text x="406" y="182" class="body"><tspan x="406" dy="0">contradictions in</tspan><tspan x="406" dy="18">my own files: crew</tspan><tspan x="406" dy="18">rate, mileage, truck</tspan><tspan x="406" dy="18">verdict. All fixed</tspan><tspan x="406" dy="18">from the case.</tspan></text>
  <!-- step 4 -->
  <rect x="562" y="100" width="150" height="380" rx="12" class="boxhi"/>
  <text x="580" y="132" class="headhi">4 · Restate</text>
  <text x="580" y="160" class="num">$104</text>
  <text x="580" y="182" class="body"><tspan x="580" dy="0">/hr crew rate, case-</tspan><tspan x="580" dy="18">documented. Loss:</tspan></text>
  <text x="580" y="228" class="numred">−$1,156</text>
  <text x="580" y="250" class="body"><tspan x="580" dy="0">was −$808. Thesis</tspan><tspan x="580" dy="18">held — stronger.</tspan></text>
  <!-- step 5 -->
  <rect x="736" y="100" width="150" height="380" rx="12" class="box"/>
  <text x="754" y="132" class="head">5 · Model</text>
  <text x="754" y="160" class="num">21</text>
  <text x="754" y="182" class="body"><tspan x="754" dy="0">loads, 7 days,</tspan><tspan x="754" dy="18">74% utilization.</tspan><tspan x="754" dy="18">Labor 92% of cost.</tspan><tspan x="754" dy="18">Routing saves $96</tspan><tspan x="754" dy="18">of the loss.</tspan></text>
  <!-- step 6 -->
  <rect x="910" y="100" width="150" height="380" rx="12" class="boxhi"/>
  <text x="928" y="132" class="headhi">6 · Decide</text>
  <text x="928" y="160" class="num" font-size="16">$150+</text>
  <text x="928" y="182" class="body"><tspan x="928" dy="0">Volume pricing:</tspan><tspan x="928" dy="18">$150 + $0.25/cu ft.</tspan><tspan x="928" dy="18">Bigger truck:</tspan><tspan x="928" dy="18">+$508 profit.</tspan><tspan x="928" dy="18">Concierge policy</tspan><tspan x="928" dy="18">for no-shows.</tspan></text>
  <!-- arrows -->
  <line x1="190" y1="290" x2="214" y2="290" class="arrow"/>
  <line x1="364" y1="290" x2="388" y2="290" class="arrow"/>
  <line x1="538" y1="290" x2="562" y2="290" class="arrow"/>
  <line x1="712" y1="290" x2="736" y2="290" class="arrow"/>
  <line x1="886" y1="290" x2="910" y2="290" class="arrow"/>
  <!-- present -->
  <rect x="40" y="500" width="1020" height="40" rx="10" fill="#111827"/>
  <text x="60" y="526" font-size="13" font-weight="600" fill="#ffffff">7 · Present — this dashboard + the SPIDER case study. Every number above reproduces from data/ via analysis/recompute.py.</text>
</svg>
