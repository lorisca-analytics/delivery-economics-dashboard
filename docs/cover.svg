<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <rect width="1200" height="675" fill="#eef2f6"/>
  <text x="72" y="96" font-size="18" font-weight="700" letter-spacing="4" fill="#4a6a8f">DELIVERY ECONOMICS · OPERATIONS CASE STUDY</text>
  <text x="72" y="176" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#1e2d42">Losing $1,156 on 13 orders.</text>
  <text x="72" y="244" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#5b7fa6">Routing wasn&#8217;t the fix.</text>

  <g>
    <rect x="72" y="312" width="508" height="291" rx="18" fill="#ffffff" stroke="#d5dfe8" stroke-width="2"/>
    <text x="104" y="362" font-size="15" font-weight="700" letter-spacing="3" fill="#4a6a8f">THE TRAP</text>
    <text x="104" y="408" font-size="30" font-weight="800" fill="#1e2d42">Chase the miles</text>
    <text x="104" y="446" font-size="19" fill="#4a6a8f">74% utilization, 438 miles — the obvious lever.</text>
    <g font-size="16" font-weight="700">
      <rect x="104" y="492" width="150" height="48" rx="24" fill="#1e2d42"/>
      <text x="179" y="522" text-anchor="middle" fill="#ffffff">−20% miles</text>
      <path d="M264 516 H294" stroke="#5b7fa6" stroke-width="3"/><path d="M294 516 l-9 -6 v12 z" fill="#5b7fa6"/>
      <rect x="306" y="492" width="140" height="48" rx="24" fill="#1e2d42"/>
      <text x="376" y="522" text-anchor="middle" fill="#ffffff">saves $96</text>
    </g>
    <text x="104" y="576" font-size="15" fill="#4a6a8f">8% of the loss. The math doesn&#8217;t close.</text>
  </g>

  <g>
    <rect x="620" y="312" width="508" height="291" rx="18" fill="#ffffff" stroke="#d5dfe8" stroke-width="2"/>
    <text x="652" y="362" font-size="15" font-weight="700" letter-spacing="3" fill="#4a6a8f">THE MECHANISM</text>
    <text x="652" y="408" font-size="30" font-weight="800" fill="#1e2d42">Price the work</text>
    <text x="652" y="446" font-size="19" fill="#4a6a8f">Labor is 92% of cost, inside customers&#8217; homes.</text>
    <g font-size="16" font-weight="700">
      <rect x="652" y="492" width="212" height="48" rx="24" fill="#5b7fa6"/>
      <text x="758" y="522" text-anchor="middle" fill="#ffffff">$150 + $0.25/cu ft</text>
      <path d="M874 516 H904" stroke="#5b7fa6" stroke-width="3"/><path d="M904 516 l-9 -6 v12 z" fill="#5b7fa6"/>
      <rect x="916" y="492" width="150" height="48" rx="24" fill="#1e2d42"/>
      <text x="991" y="522" text-anchor="middle" fill="#ffffff">+$508 profit</text>
    </g>
    <text x="652" y="576" font-size="15" fill="#4a6a8f">The loss becomes a pricing decision.</text>
  </g>
</svg>
